name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  no-dependencies:
    name: The engine imports nothing but the standard library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if agentgraph/ imports anything else
        run: |
          found=$(grep -rn "^import \|^from " agentgraph/ \
            | grep -v "sqlite3\|json\|contextvars\|datetime\|typing\|agentgraph" || true)
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
          echo "clean"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
